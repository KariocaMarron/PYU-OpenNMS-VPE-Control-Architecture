services:
  database:
    image: postgres:14
    container_name: pyu-postgres
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opennms
    volumes:
      - pyu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - pyu-main

  horizon:
    image: opennms/horizon:33.0.2
    container_name: pyu-horizon
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pyu-horizon-data:/opennms-data
      - ./overlay:/opt/opennms-overlay
    command: ["-s"]
    ports:
      - "8980:8980/tcp"
      - "8101:8101/tcp"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-I", "http://localhost:8980/opennms/login.jsp"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pyu-main
      - pyu-main-campus

volumes:
  pyu-postgres-data:
  pyu-horizon-data:

networks:
  pyu-main:
    driver: bridge
  pyu-main-campus:
    external: true

